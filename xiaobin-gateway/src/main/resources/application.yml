spring:
  application:
    name: xiaobin-gateway
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: xiaobin
        import-check:
          enabled: false
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: xiaobin
  config:
    import:
      - nacos:common-config.yaml?group=DEFAULT_GROUP&namespace=xiaobin
  gateway:
    globalcors:
      cors-configurations:
        '[/**]':
          allowedOriginPatterns: "*"
          allowedMethods: "*"
          allowedHeaders: "*"
          allowCredentials: true
          maxAge: 3600

server:
  port: 8080
