spring:
  application:
    name: xiaobin-user
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: xiaobin
        import-check:
          enabled: false
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: xiaobin
    openfeign:
      lazy-attributes-resolution: true
  config:
    import:
      - nacos:common-config.yaml?group=DEFAULT_GROUP&namespace=xiaobin
      - nacos:xiaobin-user.yaml?group=DEFAULT_GROUP&namespace=xiaobin

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

server:
  port: 8081
